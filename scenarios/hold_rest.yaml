# Hold the rest pose. The seed moves the start pose slightly, so this checks that the
# controller pulls the arm back and keeps it there (disturbance rejection).
name: hold_rest
description: Return to and hold the rest pose from a seeded, slightly perturbed start.
seed: 3
episode_steps: 750        # 1.5 simulated seconds
target_qpos_rad: [0.0, 0.0, 0.0]
tolerance_rad: 0.01
