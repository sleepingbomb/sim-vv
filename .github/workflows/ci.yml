# Runs on every push and pull request: install, lint, test with coverage.
# No MUJOCO_GL or virtual display is needed: the runner never renders, it only steps physics.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest --cov=sim_vv --cov-report=term-missing
