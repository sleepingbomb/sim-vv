# Metadata, dependencies and the pytest/ruff settings, all in one file.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-vv"
version = "0.1.0"
description = "Scenario-based regression test and V&V harness for a MuJoCo robot-arm simulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mujoco>=3.1",   # physics; runs without a display
  "numpy>=1.26",   # imported directly, not just through mujoco
  "pydantic>=2.0", # scenario validation
  "pyyaml>=6.0",   # scenario files
]

[project.optional-dependencies]
# pip install -e ".[dev]"
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
]

[tool.setuptools]
packages = ["sim_vv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra: list the xfails (the TODO list) at the end of every run
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# defaults (E, F) plus import sorting, pyupgrade and bugbear
select = ["E", "F", "I", "UP", "B"]
